# metadata
metadata:
  id: CPLYTM.CTL
  description: Threat catalog for complyctl CLI tool.
  version: 1.0.0
  author:
    id: complytime
    name: ComplyTime Team
    type: Human
  mapping-references:
    - id: CCC
      title: Common Cloud Controls Core
      version: v2025.10
      url: https://github.com/finos/common-cloud-controls/releases
      description: |
        Foundational repository of reusable security controls, capabilities,
        and threat models maintained by FINOS.
    - id: MITRE.ATT&CK
      title: MITRE.ATT&CK Framework
      version: v14.1
      url: https://attack.mitre.org/
      description: |
        A globally-accessible knowledge base of adversary tactics and techniques
        based on real-world observations.
# title
title: ComplyCtl Threat Catalog
# imported capabilities
imported-capabilities:
  - reference-id: CCC
    entries:
      - reference-id: CCC.Core.CP28
        remarks: |
          Command-line Interface - primary CLI for compliance activities.
      - reference-id: CCC.Core.CP03
        remarks: |
          Access Log Publication - generation of audit trails and machine readable logs. 
      - reference-id: CCC.Core.CP18
        remarks: |
          Resource Versioning - management of versioned scanner plugins and compliance profiles.
# imported threats
imported-threats:
  - reference-id: CCC
    entries:
      - reference-id: CCC.Core.TH10 # Access Log Publication - Tampering with Results
      - reference-id: CCC.Core.TH09 # Runtime Logs Read by Unauthorized Entities - Config Details Leaked
      - reference-id: CCC.Core.TH14 # Older Resource Versions are Used - False "Pass" if using wrong version
# capabilities
capabilities:
  - id: CPLYTM.CTL.CAP01
    title: Plugin-Based Policy Generation # Specialized System Checks
    description: |
      The ability to dynamically load scanner-specific plugins (e.g., OPA) to
      generate executable policy artifacts from a centralized OSCAL Assessment Plan
  - id: CPLYTM.CTL.CAP02
    title: OSCAL Artifact Orchestration
    description: |
      The ability to ingest, transform, and output standardized machine-readable
      compliance data using the OSCAL format (Plans, Results, and Observations).
  - id: CPLYTM.CTL.CAP03
    title: Framework Discovery and mapping
    description: |
      The ability to query and list available compliance frameworks via 
      (complyctl list) and map them to local system configurations.
# threats
threats: 
  - id: CPLYTM.CTL.THR01 
    title: Malicious Plugin Execution
    description: |
      An attacker could provide a malicious plugin that performs Unauthorized
      actions or reports "Passed" status for failing controls during the 'generate'
      or 'scan' phase.
    capabilities:
      - reference-id: CCC 
        entries:
          - reference-id: CCC.Core.CP28 # Exploits CLI 
          - reference-id: CCC.Core.CP03
      - reference-id: CPLYTM.CTL
        entries:
          - reference-id: CPLYTM.CTL.CAP01 # Exploits Plugin Orchestration
    external-mappings:
      - reference-id: MITRE.ATT&CK
        entries:
          - reference-id: T1195.001 # Supply Chain Compromise - open source deps
          - reference-id: T1204.002 # Malicious File Execution
  - id: CPLYTM.CTL.THR02 
    title: OSCAL Plan Tampering
    description: |
      Unauthorized modification of the assessment-plan.json file could lead to
      incomplete scans, effectively blinding the organization to critical security gaps.
      Excluding specific high-risk controls from the scan, ensuring a system appears
      compliant when it is not.
    capabilities:
      - reference-id: CPLYTM.CTL 
        entries:
          - reference-id: CPLYTM.CTL.CAP02 # Exploits OSCAL Artifact Management
      - reference-id: CCC 
        entries:
          - reference-id: CCC.Core.CP28
          - reference-id: CCC.Core.CP03
    external-mappings:
      - reference-id: MITRE.ATT&CK
        entries:
          - reference-id: T1562.001 # Impair Defenses: Disable or Modify Tools
  - id: CPLYTM.CTL.THR03 
    title: Credential Leakage in Audit Evidence
    description: |
      Plugins might inadvertently capture sensitive data (environment variables, tokens)
      during a scan and include them in the human-readable Markdown output from (--with-md).
    capabilities:
      - reference-id: CPLYTM.CTL 
        entries:
          - reference-id: CPLYTM.CTL.CAP02 # Artifact Generation
      - reference-id: CCC 
        entries:
          - reference-id: CCC.Core.CP03
          - reference-id: CCC.Core.CP28 # CLI flag `--with-md`
    external-mappings:
      - reference-id: MITRE.ATT&CK
        entries:
          - reference-id: T1552.001 # Unsecured Credentials